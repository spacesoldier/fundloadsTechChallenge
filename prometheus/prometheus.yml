global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: stream_kernel
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9466
        labels:
          app: stream-kernel

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: stream_kernel_textfile
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          app: stream-kernel
          source: textfile
