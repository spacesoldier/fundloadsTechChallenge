version: 1

scenario:
  name: baseline_mp_jaeger
  description: "Baseline velocity rules (newgen config, multiprocess profile, Jaeger OTLP tracing)"

runtime:
  strict: true
  tracing:
    enabled: true
  observability:
    service_worker:
      enabled: true
      queue_max_items: 131072
      drop_policy: non_block
      drain_timeout_seconds: 120
    tracing:
      dispatch_queue:
        max_items: 131072
        drop_policy: non_block
        forward_batch_max_items: 40
        forward_flush_interval_ms: 20
        drain_timeout_seconds: 120
      exporters:
        - kind: jsonl
          enabled: true
          settings:
            path: trace_baseline_multiprocess_jaeger.jsonl
            write_mode: batch
            flush_every_n: 256
        - kind: otel_otlp_topology
          enabled: false
          settings:
            otlp:
              endpoint: http://127.0.0.1:4318/v1/traces
            transport:
              backend: httpx
              timeout_seconds: 2.0
              batch:
                max_items: 2000
                flush_interval_ms: 100
              queue:
                max_items: 131072
                drop_policy: non_block
              httpx:
                mode: async
            service:
              service_name: fund-load-experiment-multiprocess
              service_namespace: stream-kernel
              service_version: 1.0.0-dev
              deployment_environment: local-dev
            view:
              trace_view: topology
              service_name_by_step: false
              service_name_by_process_group: true
              service_name_suffix: .topology
              isolate_view_ids: true
              include_runtime_resource: true
              span_kind: SPAN_KIND_INTERNAL
        - kind: otel_otlp_logical
          enabled: true
          settings:
            otlp:
              endpoint: http://127.0.0.1:4318/v1/traces
            transport:
              backend: httpx
              timeout_seconds: 2.0
              batch:
                max_items: 2000
                flush_interval_ms: 100
              queue:
                max_items: 131072
                drop_policy: non_block
              httpx:
                mode: async
            service:
              service_name: fund-load-experiment-multiprocess
              service_namespace: stream-kernel
              service_version: 1.0.0-dev
              deployment_environment: local-dev
            view:
              trace_view: logical
              service_name_by_step: true
              service_name_by_process_group: false
              service_name_suffix: .logical
              isolate_view_ids: true
              include_runtime_resource: true
              span_kind: SPAN_KIND_INTERNAL
    logging:
      exporters:
        - kind: stdout_plain
        - kind: file_plain
          settings:
            path: logs/lifecycle_baseline_multiprocess_jaeger.log
        - kind: jsonl
          settings:
            path: logs/lifecycle_baseline_multiprocess_jaeger.jsonl
      lifecycle_events:
        enabled: true
        level: info   # off | none | info | debug | full
  discovery_modules:
    - fund_load
  platform:
    lifecycle:
      graceful_timeout_seconds: 120
      drain_inflight: true
      stop_command_timeout_seconds: 0.0
      fallback_graceful_timeout_seconds: 0.0
    execution_ipc:
      transport: ipc_local
      buffer:
        enabled: true
        batch_max_items: 40
        flush_interval_ms: 10
      flow_control:
        mode: credits
        credits:
          window_size: 4096
      auth:
        mode: hmac
        secret_mode: generated
        kdf: hkdf_sha256
        ttl_seconds: 30
        nonce_cache_size: 100000
      max_payload_bytes: 65536
    bootstrap:
      mode: process_supervisor
    boundary_dispatch:
      mode: stream
      control_poll_ms: 1.0
      batch_max_items: 10
      stream_batch_max_items: 128
      timeout_seconds: 600.0
      inflight_idle_timeout_seconds: 5.0
    source_ingress:
      pacing_mode: batch
      batch_size: 10
      advance_signal: sink_dispatch_ack
    process_groups:
      - name: execution.ingress
        workers: 1
        nodes:
          - source:source
          - ingress_line_bridge
          - parse_load_attempt
      - name: execution.features
        workers: 1
        nodes:
          - compute_time_keys
          - idempotency_gate
          - compute_features
      - name: execution.policy
        workers: 1
        nodes:
          - evaluate_policies
          - update_windows
      - name: execution.egress
        workers: 1
        nodes:
          - format_output
          - egress_line_bridge
          - sink:sink
    readiness:
      enabled: true
      start_work_on_all_groups_ready: true
      readiness_timeout_seconds: 30
      fail_on_timeout: true
    runner_loop:
      reply_drain_max_items: 256
      post_start_settle_enabled: true
      post_start_settle_max_wait_seconds: 0.0
      post_start_settle_quiet_window_seconds: 1.0

nodes:
  compute_time_keys:
    week_start: MON

  compute_features:
    monday_multiplier:
      enabled: false
      multiplier: 2.0
      apply_to: amount
    prime_gate:
      enabled: false
      global_per_day: 1
      amount_cap: 9999.00

  evaluate_policies:
    limits:
      daily_amount: 5000.00
      weekly_amount: 20000.00
      daily_attempts: 3
    prime_gate:
      enabled: false
      global_per_day: 1
      amount_cap: 9999.00

  update_windows:
    daily_attempts:
      enabled: true
    daily_accepted_amount:
      enabled: true
    weekly_accepted_amount:
      enabled: true
    daily_prime_gate:
      enabled: false

adapters:
  source:
    emit_tombstone: true
    settings:
      path: input.txt
      format: text/jsonl
      encoding: utf-8
      decode_errors: strict
    binds:
      - stream
  sink:
    settings:
      path: output_baseline_multiprocess_jaeger.txt
      format: text/jsonl
      encoding: utf-8
    binds:
      - stream
