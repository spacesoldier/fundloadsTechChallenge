version: 1

scenario:
  name: exp_mp_multiprocess_jaeger
  description: "Experimental profile (multiprocess + Jaeger OTLP tracing)"

runtime:
  strict: true
  tracing:
    enabled: true
  observability:
    service_worker:
      enabled: true
      stop_command_timeout_seconds: 1.0
      queue_max_items: 131072
      drop_policy: block_with_timeout
      block_timeout_ms: 1000
      drain_timeout_seconds: 120
    tracing:
      dispatch_queue:
        max_items: 131072
        drop_policy: block_with_timeout
        block_timeout_ms: 1000
        forward_batch_max_items: 20
        forward_flush_interval_ms: 20
        drain_timeout_seconds: 120
      exporters:
        - kind: jsonl
          enabled: true
          settings:
            path: traces/trace_experiment_multiprocess_jaeger_all.jsonl
            write_mode: batch
            flush_every_n: 256
            trace_slice: all
        - kind: jsonl
          enabled: true
          settings:
            path: traces/trace_experiment_multiprocess_jaeger_business_logic.jsonl
            write_mode: line
            flush_every_n: 100
            trace_slice: business_logic
        - kind: jsonl
          enabled: true
          settings:
            path: traces/trace_experiment_multiprocess_jaeger_platform_internals.jsonl
            write_mode: line
            flush_every_n: 100
            trace_slice: platform_internals
        - kind: otel_otlp_topology
          enabled: true
          settings:
            otlp:
              endpoint: http://127.0.0.1:4318/v1/traces
            transport:
              backend: httpx
              timeout_seconds: 2.0
              batch:
                max_items: 20
                flush_interval_ms: 100
              queue:
                max_items: 131072
                drop_policy: block_with_timeout
                block_timeout_ms: 1000
              httpx:
                mode: async
            service:
              service_name: fund-load-exp
              service_namespace: stream-kernel
              service_version: 1.0.0-dev
              deployment_environment: local-dev
            view:
              trace_view: topology
              service_name_by_step: false
              service_name_by_process_group: true
              service_name_suffix: -topology
              isolate_view_ids: true
              include_runtime_resource: true
              span_kind: SPAN_KIND_INTERNAL
        - kind: otel_otlp_logical
          enabled: true
          settings:
            otlp:
              endpoint: http://127.0.0.1:4318/v1/traces
            transport:
              backend: httpx
              timeout_seconds: 2.0
              batch:
                max_items: 20
                flush_interval_ms: 100
              queue:
                max_items: 131072
                drop_policy: block_with_timeout
                block_timeout_ms: 1000
              httpx:
                mode: async
            service:
              service_name: fund-load-exp
              service_namespace: stream-kernel
              service_version: 1.0.0-dev
              deployment_environment: local-dev
            view:
              trace_view: logical
              service_name_by_step: true
              service_name_by_process_group: false
              service_name_suffix: -logical
              isolate_view_ids: true
              include_runtime_resource: true
              span_kind: SPAN_KIND_INTERNAL
    logging:
      exporters:
        - kind: stdout_plain
          mode: lifecycle
        - kind: file_plain
          mode: lifecycle
          settings:
            path: logs/lifecycle_experiment_multiprocess_jaeger.log
        - kind: jsonl
          mode: lifecycle
          settings:
            path: logs/lifecycle_experiment_multiprocess_jaeger.jsonl
        - kind: jsonl
          mode: all
          settings:
            path: logs/runtime_all_experiment_multiprocess_jaeger.jsonl
        - kind: redis_debug
          mode: all
          settings:
            host: 127.0.0.1
            port: 6379
            db: 0
            key_prefix: stream_kernel:debug
            ttl_seconds: 86400
            connect_timeout_seconds: 0.2
            socket_timeout_seconds: 1.0
            write_mode: inline
            queue_max_items: 32768
            batch_max_items: 256
            batch_flush_interval_ms: 20
            capture_all_events: true
            only_debug_channel: false
      lifecycle_events:
        enabled: true
        level: info
    monitoring:
      exporters:
        - kind: jsonl
          enabled: true
          settings:
            path: metrics/worker_queue_timeseries_experiment_multiprocess_jaeger.jsonl
            flush_every_n: 100
        - kind: prometheus
          enabled: false
          settings:
            mode: http_pull
            namespace: stream_kernel
            subsystem: observability
            http:
              host: 0.0.0.0
              port: 9466
              path: /metrics
        - kind: prometheus
          enabled: true
          settings:
            mode: textfile
            namespace: stream_kernel
            subsystem: observability
            textfile:
              path: metrics/stream_kernel_observability_experiment.prom
    worker_queue_telemetry:
      enabled: false
      sample_hz: 10
  discovery_modules:
    - fund_load
  platform:
    debug:
      root_verbose_logging: true
      leaf_debug_enabled: false
      leaf_verbose_logging: false
      leaf_debug_write_to_file: false
      leaf_debug_logs_dir: logs/leaf_debug
      runtime_debug_direct_dispatch: true
    lifecycle:
      graceful_timeout_seconds: 120
      drain_inflight: true
      stop_command_timeout_seconds: 1.0
      fallback_graceful_timeout_seconds: 2.0
    execution_ipc:
      transport: ipc_local
      flow_control:
        mode: none
      auth:
        mode: hmac
        secret_mode: generated
        kdf: hkdf_sha256
        ttl_seconds: 30
        nonce_cache_size: 100000
      max_payload_bytes: 1048576
    bootstrap:
      mode: process_supervisor
    boundary_dispatch:
      mode: stream
      control_poll_ms: 1.0
      batch_max_items: 10
      stream_batch_max_items: 10
      timeout_seconds: 600.0
      inflight_idle_timeout_seconds: 5.0
    process_groups:
      - name: execution.ingress
        workers: 1
        nodes:
          - source:source
          - ingress_line_bridge
          - parse_load_attempt
      - name: execution.features
        workers: 1
        nodes:
          - compute_time_keys
          - idempotency_gate
          - compute_features
      - name: execution.policy
        workers: 1
        nodes:
          - evaluate_policies
          - update_windows
      - name: execution.egress
        workers: 1
        nodes:
          - format_output
          - egress_line_bridge
          - sink:sink
    readiness:
      enabled: true
      start_work_on_all_groups_ready: true
      readiness_timeout_seconds: 30
      fail_on_timeout: true
    runner_loop:
      post_start_settle_enabled: true
      post_start_settle_max_wait_seconds: 30
      post_start_settle_quiet_window_seconds: 1.0

nodes:
  compute_time_keys:
    week_start: MON

  compute_features:
    monday_multiplier:
      enabled: true
      multiplier: 2.0
      apply_to: amount
    prime_gate:
      enabled: true
      global_per_day: 1
      amount_cap: 9999.00

  evaluate_policies:
    limits:
      daily_amount: 5000.00
      weekly_amount: 20000.00
      daily_attempts: 3
    prime_gate:
      enabled: true
      global_per_day: 1
      amount_cap: 9999.00

  update_windows:
    daily_attempts:
      enabled: true
    daily_accepted_amount:
      enabled: true
    weekly_accepted_amount:
      enabled: true
    daily_prime_gate:
      enabled: true

adapters:
  source:
    emit_tombstone: true
    settings:
      path: input.txt
      format: text/jsonl
      encoding: utf-8
      decode_errors: strict
    binds:
      - stream
  sink:
    settings:
      path: output_exp_mpj.txt
      format: text/jsonl
      encoding: utf-8
    binds:
      - stream
